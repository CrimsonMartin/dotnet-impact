# TEMPORARY: prints the service principal's Azure DevOps profile ID, which is
# the only identifier the Marketplace publisher "Members" dialog accepts.
# Delete this file once the member has been added.
name: OIDC probe

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: 15353807-34d4-4f16-8eab-1f73d0fc4eb2
          tenant-id: 618712c8-62d0-4426-a07d-b93f6b32e08b
          allow-no-subscriptions: true

      - name: Get Azure DevOps profile ID for this identity
        run: |
          # 499b84ac-1321-427f-aa17-267ca6975798 is the well-known Azure DevOps resource ID
          TOKEN=$(az account get-access-token \
                    --resource 499b84ac-1321-427f-aa17-267ca6975798 \
                    --query accessToken -o tsv)
          echo "--- vssps profiles/me as the service principal ---"
          curl -sS -H "Authorization: Bearer $TOKEN" \
            'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=6.0' \
            | tee /tmp/profile.json
          echo
          echo "=================================================="
          echo "PASTE THIS INTO MARKETPLACE MEMBERS:"
          python3 -c "import json;print(json.load(open('/tmp/profile.json'))['id'])"
          echo "=================================================="
