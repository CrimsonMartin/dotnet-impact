name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package VSIX
        run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 14
