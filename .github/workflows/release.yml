name: Release

# Push a version tag (v0.1.0) to test, package, publish to the VS Code
# Marketplace, and attach the .vsix to a GitHub release.
#
# Required repo secret: VSCE_PAT  (Azure DevOps PAT, Marketplace -> Manage scope)
# Optional repo secret: OVSX_TOKEN (open-vsx.org token; skipped when absent)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Sync package version to tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Package
        run: npx --yes @vscode/vsce package
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --packagePath *.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX (optional)
        if: ${{ env.OVSX_TOKEN != '' }}
        run: npx --yes ovsx publish *.vsix -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      - name: Attach vsix to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
